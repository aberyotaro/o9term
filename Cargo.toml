[package]
name = "os9terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
softbuffer = "0.4.8"
unicode-width = "0.2.2"
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9.4"
core-graphics = "0.23.2"
core-text = "20.1.0"
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSObject", "NSString", "NSThread", "NSURL"] }
